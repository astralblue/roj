# Dependabot configuration.  This file supersedes any Dependabot settings
# configured through the GitHub UI.
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2

updates:
  # pyproject.toml [dependency-groups] plus the committed uv.lock.  roj has
  # no runtime dependencies, so everything in the lock is dev tooling: one
  # catch-all group keeps this to a single pull request per week rather than
  # one per package.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "build(deps)"
    groups:
      python-tooling:
        patterns:
          - "*"

  # Actions referenced from .github/workflows/*.yml.  This is what keeps the
  # exactly-pinned setup-uv and gh-action-pypi-publish references current --
  # neither publisher offers a floating major tag to track instead.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
